<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask My Docs</title>
<style>
  :root {
    --bg: #fbfbfa;        --panel: #ffffff;     --ink: #1b1b19;
    --muted: #6b6b66;     --line: #e4e4df;      --accent: #2f6f4e;
    --accent-soft: #e8f1ec;
    --warn: #8a6410;      --warn-soft: #fdf4e0;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;      --panel: #1e2024;     --ink: #e8e8e4;
      --muted: #9a9a94;   --line: #2e3138;      --accent: #6fc297;
      --accent-soft: #1d2b24;
      --warn: #e0b256;    --warn-soft: #2b2415;
    }
  }
  * { box-sizing: border-box; }
  /* Smoothness lives in CSS, not in scrollIntoView({behavior:'smooth'}) — the
     JS flag silently does nothing in some browsers, whereas the CSS property
     degrades to an instant jump, which is the behaviour that matters. */
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .src.flash { animation: none; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  #status { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #status b { color: var(--accent); font-weight: 600; }

  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] {
    flex: 1; padding: 11px 13px; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 0; border-radius: var(--radius);
  }
  button:disabled { opacity: .55; cursor: default; }
  .opts { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .opts input[type=text] { flex: 0 1 220px; padding: 6px 9px; font-size: 13px; }
  .opts label { display: flex; align-items: center; gap: 6px; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px;
  }
  .answer { font-size: 16px; line-height: 1.75; }
  .answer p { margin: 0 0 10px; }
  .answer p:last-child { margin-bottom: 0; }

  /* Citation chips are the point of the whole system — make them the most
     clickable thing on the page. */
  .cite {
    display: inline-block; margin-left: 4px; padding: 1px 7px;
    font: 600 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid transparent; border-radius: 20px;
    cursor: pointer; vertical-align: baseline; white-space: nowrap;
  }
  .cite:hover, .cite:focus { border-color: var(--accent); outline: none; }

  .refusal { color: var(--muted); font-style: italic; }

  .banner {
    background: var(--warn-soft); color: var(--warn); border: 1px solid currentColor;
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 26px 0 10px; font-weight: 600; }

  .src { border: 1px solid var(--line); border-radius: var(--radius);
         padding: 12px 14px; margin-bottom: 8px; background: var(--panel); }
  .src.flash { animation: flash 1.4s ease-out; }
  @keyframes flash {
    0%, 30% { border-color: var(--accent); background: var(--accent-soft); }
    100% { border-color: var(--line); background: var(--panel); }
  }
  .src-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .src-id { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
  .src-sec { font-size: 12px; color: var(--muted); flex: 1; min-width: 0;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font: 11px ui-monospace, monospace; color: var(--muted); }
  .bar { width: 46px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .src-text { font-size: 13.5px; color: var(--ink); opacity: .82; white-space: pre-wrap; margin: 0; }

  /* Stage timings — the thing that made every optimisation in this project
     legible, so it belongs in the UI rather than only in the CLI. */
  .timings { display: flex; gap: 3px; margin-bottom: 6px; }
  .timings div { height: 6px; border-radius: 2px; min-width: 2px; }
  .tlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted);
             font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tlegend span::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 2px; background: currentColor; margin-right: 5px;
  }
  /* Add-documents affordance. Deliberately quiet until you drag something. */
  .docs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
          font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; font-weight: 600;
             color: var(--accent); cursor: pointer; text-decoration: underline; }
  .linkbtn:disabled { opacity: .55; cursor: default; }
  .chipfile { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
              background: var(--accent-soft); color: var(--accent);
              padding: 2px 8px; border-radius: 20px; }
  .chipfile.bad { background: var(--warn-soft); color: var(--warn); }

  .stages { display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
            margin: 0 0 22px; font-size: 12px; color: var(--muted); }
  .stage { display: flex; align-items: center; gap: 6px; }
  .stage label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .stage select {
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 260px;
  }
  .stage select:disabled { opacity: .6; }
  .stage-note { font-size: 11.5px; opacity: .8; }

  #doclist { margin: -14px 0 24px; }
  .doc { display: flex; align-items: baseline; gap: 10px; padding: 5px 0;
         border-bottom: 1px solid var(--line); font-size: 13px; }
  .doc:last-child { border-bottom: 0; }
  .doc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .doc-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .doc-meta.bad { color: var(--warn); }

  /* Full-window drop target: dragging a file anywhere should work, because
     aiming at a small rectangle is the annoying part of file uploads. */
  #drop {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    border: 3px dashed var(--accent); font-size: 18px; font-weight: 600; color: var(--accent);
  }
  #drop.on { display: flex; }

  .hidden { display: none; }
  .spin { display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
          border: 2px solid currentColor; border-right-color: transparent;
          border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: #b4342b; }
  @media (prefers-color-scheme: dark) { .err { color: #f08b82; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ask My Docs</h1>
    <div id="status">checking…</div>
    <label id="tokenbox" class="hidden" title="Bearer token. What it grants decides which documents you can retrieve.">
      token <input id="token" type="password" placeholder="paste your token" autocomplete="off">
    </label>
  </header>

  <form id="f">
    <input id="q" type="text" placeholder="Ask a question about the indexed documents…" autocomplete="off" autofocus>
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="opts">
    <label title="Tags applied to documents you upload. What you may RETRIEVE is decided by your token, not by this box.">
      Upload ACL <input id="acl" type="text" placeholder="finance,hr" autocomplete="off">
    </label>
    <label title="Bypass the semantic cache."><input id="nocache" type="checkbox"> no cache</label>
  </div>

  <div class="docs">
    <input id="file" type="file" class="hidden" multiple
           accept=".md,.markdown,.txt,.csv,.tsv,.tab,.pdf,.docx,.pptx,.xlsx">
    <button id="add" class="linkbtn" type="button">+ Add documents</button>
    <span id="docstate">— or drag files anywhere on this page</span>
  </div>
  <div id="doclist"></div>

  <div class="stages">
    <span class="stage"><label for="llm-sel">generate</label><select id="llm-sel"></select></span>
    <span class="stage"><label for="verify-sel">verify</label><select id="verify-sel"></select></span>
    <span id="fixednote" class="stage-note"></span>
  </div>

  <div id="out"></div>
</div>

<div id="drop">Drop Word, PowerPoint, Excel, Markdown or text files to index them</div>

<script>
const $ = s => document.querySelector(s);

// api wraps fetch so the bearer token is attached in exactly one place. A 401
// reveals the token box rather than reporting a failure: on an unauthenticated
// server the box never appears, which is the only way the UI is allowed to say
// anything about whether auth is on.
const api = async (url, opts = {}) => {
  const tok = localStorage.getItem('amd_token');
  const headers = { ...(opts.headers || {}) };
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) {
    $('#tokenbox').classList.remove('hidden');
    $('#token').focus();
    if (tok) localStorage.removeItem('amd_token');
  }
  return r;
};
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };

// Stage colours are fixed so the same stage is the same colour every query —
// the shape of the bar becomes recognisable at a glance.
const STAGES = [
  ['embed',    '#7aa2c8'], ['retrieve', '#6fc297'], ['rerank',   '#e0b256'],
  ['generate', '#b48ad4'], ['verify',   '#d4907a'],
];

function refreshStatus() {
  return fetch('/healthz').then(r => r.json()).then(h => {
    $('#status').innerHTML =
      `<b>${h.provider}</b> · ${h.llm} · rerank ${h.reranker} · gate ${h.gate} · ${h.chunks} chunks`;
  }).catch(() => { $('#status').textContent = 'server unreachable'; });
}

// The indexed corpus is server state, so it is rendered from /documents on
// every load rather than only after an upload. Previously a refresh left the
// page looking empty even though the documents were still indexed.
function listDocs() {
  return api('/documents').then(r => r.json()).then(d => {
    const docs = d.documents || [];
    const list = $('#doclist');
    list.replaceChildren();

    if (!docs.length) {
      $('#docstate').textContent = '— index is empty, add documents to ask anything';
      return;
    }
    const total = docs.reduce((n, x) => n + (x.chunks || 0), 0);
    $('#docstate').textContent =
      `— ${docs.length} document${docs.length === 1 ? '' : 's'}, ${total} chunks indexed`;

    for (const doc of docs) {
      const row = el('div', 'doc');
      row.append(el('span', 'doc-name', doc.name));
      // A file on disk with zero chunks was saved but never indexed. Say so
      // plainly — it is otherwise invisible and looks like a retrieval bug.
      if (doc.chunks > 0) {
        row.append(el('span', 'doc-meta', `${doc.chunks} chunk${doc.chunks === 1 ? '' : 's'}`));
      } else {
        row.append(el('span', 'doc-meta bad', 'not indexed — run ingest'));
      }
      row.append(el('span', 'doc-meta', fmtBytes(doc.bytes)));
      list.append(row);
    }
  }).catch(() => {});
}

function fmtBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

// --- Switching backends ---------------------------------------------------
// Generation and verification are stateless, so they can be swapped while the
// server runs. Embeddings deliberately cannot: the index holds vectors from one
// model, and changing it would not error — it would silently retrieve nonsense.

function loadProviders() {
  return api('/providers').then(r => r.json()).then(p => {
    fillStage('#llm-sel', 'llm', p);
    fillStage('#verify-sel', 'verify', p);
    $('#fixednote').textContent = 'embeddings: ' + (p.fixed?.embeddings || '');
  }).catch(err => {
    // Do not swallow this. An empty dropdown with no explanation looks like
    // "no models available" when it is actually a bug in this page.
    console.error('loadProviders failed', err);
    $('#fixednote').textContent = 'could not load backends: ' + err.message;
  });
}

function fillStage(id, stage, p) {
  const sel = $(id);
  const cur = p.current?.[stage] || {};
  sel.replaceChildren();

  for (const [provider, info] of Object.entries(p.available || {})) {
    if (!info.ready) {
      // Show why an option is missing instead of silently omitting it.
      const og = el('optgroup');
      og.label = `${provider} — ${info.reason || 'unavailable'}`;
      og.disabled = true;
      sel.append(og);
      continue;
    }
    const og = el('optgroup');
    og.label = provider;
    for (const m of info.models || []) {
      const o = el('option', null, m);
      o.value = JSON.stringify({ provider, model: m });
      if (provider === cur.provider && m === cur.model) o.selected = true;
      og.append(o);
    }
    sel.append(og);
  }

  sel.onchange = async () => {
    const { provider, model } = JSON.parse(sel.value);
    const previous = sel.dataset.current;
    sel.disabled = true;
    try {
      const r = await api('/providers', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage, provider, model }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.statusText);
      sel.dataset.current = sel.value;
      await refreshStatus();
    } catch (err) {
      // Put the control back where it was: leaving it showing a model the
      // server rejected would misreport what is actually running.
      if (previous) sel.value = previous;
      $('#docstate').replaceChildren(el('span', 'chipfile bad', `switch failed: ${err.message}`));
    } finally {
      sel.disabled = false;
    }
  };
  sel.dataset.current = sel.value;
}

$('#token').onchange = async () => {
  const v = $('#token').value.trim();
  if (!v) return;
  localStorage.setItem('amd_token', v);
  $('#token').value = '';
  // Reloading the two authenticated views is the confirmation: they either
  // populate or bounce straight back to 401.
  await Promise.all([listDocs(), loadProviders()]);
};

refreshStatus();
listDocs();
loadProviders();

// --- Adding documents -----------------------------------------------------
// Files are uploaded, written into the corpus directory server-side, and
// indexed in the same request.

$('#add').onclick = () => $('#file').click();
$('#file').onchange = e => { upload(e.target.files); e.target.value = ''; };

let dragDepth = 0;
addEventListener('dragenter', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault(); dragDepth++; $('#drop').classList.add('on');
});
addEventListener('dragover', e => { if (dragDepth) e.preventDefault(); });
// dragleave fires when crossing child elements too, so count enters and
// leaves rather than hiding on the first one.
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
addEventListener('drop', e => {
  if (!e.dataTransfer?.files?.length) return;
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  upload(e.dataTransfer.files);
});

async function upload(fileList) {
  const files = [...(fileList || [])];
  if (!files.length) return;

  const state = $('#docstate');
  $('#add').disabled = true;
  state.innerHTML = `<span class="spin"></span> &nbsp;indexing ${files.length} file${files.length === 1 ? '' : 's'} — chunking, contextualizing and embedding…`;

  const fd = new FormData();
  for (const f of files) fd.append('files', f, f.name);
  const acl = $('#acl').value.trim();
  if (acl) fd.append('acl', acl);

  try {
    const r = await api('/documents', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);

    // Rejections need to stay visible; successes are about to be shown in the
    // document list, so only surface what went wrong.
    const failed = (d.results || []).filter(r => r.error);
    state.replaceChildren();
    for (const res of failed) {
      const chip = el('span', 'chipfile bad', `${res.name}: ${res.error}`);
      chip.title = res.error;
      state.append(chip, document.createTextNode(' '));
    }
    await Promise.all([refreshStatus(), listDocs()]);
    if (failed.length) {
      // listDocs overwrites the state line, so re-assert the failures after it.
      state.replaceChildren();
      for (const res of failed) {
        state.append(el('span', 'chipfile bad', `${res.name}: ${res.error}`), document.createTextNode(' '));
      }
    }
  } catch (err) {
    state.innerHTML = '';
    state.append(el('span', 'chipfile bad', 'upload failed: ' + err.message));
  } finally {
    $('#add').disabled = false;
  }
}

$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const question = $('#q').value.trim();
  if (!question) return;

  const out = $('#out');
  $('#go').disabled = true;
  out.replaceChildren(Object.assign(el('div', 'card'), {
    innerHTML: '<span class="spin"></span> &nbsp;retrieving, reranking, generating, verifying…'
  }));

  // No acl here on purpose. The server takes the caller's tags from their
  // token and discards anything the body claims, so sending one would only
  // suggest this box still decides what you can read. It does not.
  try {
    const r = await api('/query', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, no_cache: $('#nocache').checked }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    render(data);
  } catch (err) {
    out.replaceChildren(Object.assign(el('div', 'card err'), { textContent: 'Error: ' + err.message }));
  } finally {
    $('#go').disabled = false;
  }
});

function render(d) {
  const out = $('#out');
  out.replaceChildren();

  // Warnings are how the pipeline explains itself — a dropped citation, a
  // retry, an unentailed claim. Surfacing them turns a bare refusal into a
  // diagnosis instead of a shrug.
  if (d.warnings?.length) {
    const b = el('div', 'banner');
    b.append(el('strong', null, 'Pipeline notes'));
    const ul = el('ul');
    d.warnings.forEach(w => ul.append(el('li', null, w)));
    b.append(ul);
    out.append(b);
  }

  const card = el('div', 'card answer');
  if (!d.sufficient) {
    // A refusal is a designed outcome, not a failure — style it as calm, not red.
    card.append(el('p', 'refusal', d.answer));
  } else {
    for (const c of d.claims || []) {
      const p = el('p');
      p.append(document.createTextNode(c.text));
      for (const id of c.citations || []) {
        const chip = el('span', 'cite', id);
        chip.tabIndex = 0;
        chip.title = 'Show this source';
        const jump = () => {
          const t = document.getElementById('src-' + id);
          if (!t) return;
          t.scrollIntoView({ block: 'center' });
          // Restart the animation with a synchronous reflow rather than
          // requestAnimationFrame: rAF is throttled to nothing in a background
          // tab, so the highlight would silently never appear for anyone who
          // clicks a citation in a tab that is not frontmost.
          t.classList.remove('flash');
          void t.offsetWidth;
          t.classList.add('flash');
        };
        chip.onclick = jump;
        chip.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(); } };
        p.append(chip);
      }
      card.append(p);
    }
  }
  out.append(card);

  const t = d.timings_ms || {};
  const tcard = el('div', 'card');
  if (d.cache_hit) {
    // On a cache hit every stage after the query embedding is skipped, so a
    // stage breakdown would be a row of zeros pretending to be a measurement.
    const s = el('div', 'tlegend');
    s.append(el('span', null,
      `served from semantic cache in ${t.total ?? 0}ms — retrieval, reranking, generation and verification all skipped`));
    s.firstChild.style.color = 'var(--accent)';
    tcard.append(s);
  } else {
    const bar = el('div', 'timings');
    const legend = el('div', 'tlegend');
    for (const [name, colour] of STAGES) {
      const ms = t[name] || 0;
      if (ms > 0) {
        const seg = el('div');
        seg.style.cssText = `background:${colour};flex:${ms}`;
        seg.title = `${name}: ${ms}ms`;
        bar.append(seg);
      }
      const s = el('span', null, `${name} ${ms}ms`);
      s.style.color = colour;
      legend.append(s);
    }
    const foot = el('div', 'tlegend');
    foot.style.marginTop = '8px';
    foot.append(el('span', null, `total ${t.total ?? 0}ms`));
    foot.firstChild.style.color = 'var(--muted)';
    tcard.append(bar, legend, foot);
  }
  out.append(tcard);

  if (d.sources?.length) {
    out.append(el('h2', null, `Sources passed to the model (${d.sources.length})`));
    for (const s of d.sources) {
      const box = el('div', 'src');
      box.id = 'src-' + s.chunk_id;
      const head = el('div', 'src-head');
      head.append(el('span', 'src-id', s.chunk_id), el('span', 'src-sec', s.section || s.doc_id));
      const bar = el('div', 'bar');
      // Rerank scores span orders of magnitude, so a linear bar would show
      // nothing. sqrt keeps low-but-admitted chunks visible.
      bar.append(Object.assign(el('i'), { style: `width:${Math.sqrt(Math.max(0, Math.min(1, s.score))) * 100}%` }));
      head.append(bar, el('span', 'score', s.score.toFixed(3)));
      box.append(head, el('p', 'src-text', s.text));
      out.append(box);
    }
  }
}
</script>
</body>
</html>
