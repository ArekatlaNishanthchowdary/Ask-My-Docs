name: eval

on:
  pull_request:
  push:
    branches: [main]
  # The gate depends on repository secrets and on two service containers, none
  # of which are part of a commit. When one of those changes -- a key added or
  # rotated, a quota restored -- the answer to "does the gate pass now" should
  # not require an empty commit to ask.
  workflow_dispatch:

jobs:
  # Unit tests plus the Qdrant wire-format integration tests, which use
  # synthetic vectors and need no API keys. Always runs, forks included.
  unit:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # Quality gate. Runs the real pipeline against a real index.
  #
  # PROVIDER=nvidia because NIM serves embeddings *and* generation from one key,
  # so the gate needs a single secret rather than a pair. GitHub-hosted runners
  # have no GPU, so a local 7B is not an option here; to gate the local stack
  # instead, move this job to a self-hosted runner with Ollama, set
  # PROVIDER=ollama, and regenerate the baseline — baselines are config-specific
  # and not comparable across backends.
  #
  # It scores eval/ci-golden.jsonl against eval/fixtures/, both committed. The
  # everyday set under eval/golden.jsonl references chunk ids from corpus/,
  # which is gitignored so nobody publishes their documents by accident — CI
  # could never resolve those ids.
  eval:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # Without a cross-encoder the reranker falls back to an LLM scoring all 50
      # candidates, which is both slower and far more expensive per run than the
      # rest of the gate put together. CPU image: the runner has no GPU.
      #
      # bge-reranker-base here, NOT the bge-reranker-v2-m3 that docker-compose
      # runs locally, and the difference is forced rather than a preference.
      # TEI's CPU image has only an ONNX backend, and it fails closed when a
      # repository ships no ONNX weights:
      #
      #   Could not start ORT backend: File at `.../onnx/model.onnx`
      #   does not exist
      #
      # BAAI/bge-reranker-v2-m3 publishes safetensors only, so the container
      # never became healthy and the job died at "Wait for the reranker" -- for
      # ten minutes, on every run, once the gate was finally switched on.
      # bge-reranker-base publishes onnx/model.onnx and starts. Locally the
      # CUDA image has a Candle backend and serves v2-m3 fine, which is exactly
      # why this went unnoticed: the CPU path had never once run.
      #
      # Consequence to respect: eval/ci-baseline.json is recorded against THIS
      # model, not the local one. Changing either model means re-recording it.
      #
      # And this reranker is genuinely weaker, not merely different. Measured on
      # the 169-chunk fixture corpus, same embedder, same golden set:
      #
      #                      retrieval  final   rerank_lift
      #   bge-reranker-v2-m3   0.913    0.949      +0.036
      #   bge-reranker-base    0.877    0.813      -0.063
      #
      # A negative lift means reranking actively hurts: CANDIDATE_K=50 is
      # reordered and then cut to TOP_K=10, so a weak cross-encoder pushes
      # relevant chunks out of the window that plain fusion had ranked inside
      # it. The distractors are built to be confusable and this model is not
      # strong enough to separate them.
      #
      # That is tolerable ONLY because of what this gate is for. It is a
      # tripwire for regressions in THIS repository's code -- fusion, gating,
      # citation resolution, the TEI client -- measured against a baseline
      # recorded under the identical configuration. It is not a quality claim,
      # and these numbers must never be quoted as the pipeline's retrieval
      # quality. The honest figures come from the local stack, in the README.
      #
      # ONNX exports of v2-m3 exist on the Hub from third parties. Pinning
      # someone else's unaudited weights into CI is a supply-chain decision,
      # not a convenience one, so it is deliberately not taken here.
      reranker:
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
        ports: ["8081:80"]
        env:
          MODEL_ID: BAAI/bge-reranker-base
    env:
      PROVIDER: nvidia
      LLM_PROVIDER: nvidia
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # No default exists for this on purpose — running against a model nobody
      # chose is worse than a startup error naming the variable — so the gate
      # has to name it, and pin it, or the baseline drifts with the provider's
      # idea of "latest".
      #
      # meta/llama-3.1-70b-instruct hit NVIDIA's own end-of-life on
      # 2026-08-26 and started returning 410 Gone. Pinning still does not
      # mean permanent: NVIDIA retires NIM-hosted models on their own
      # schedule, and this CI account is only entitled to a subset of the
      # catalog (most models 404 with "Function ... Not found for account"),
      # so a future retirement needs the same check this one got — confirm
      # the account can actually invoke the replacement, with a request
      # shaped like this pipeline's real ones (a system prompt plus a few
      # sources plus strict json_schema, not a bare "reply with ok"), before
      # pinning it. mistralai/mistral-nemotron looked like the obvious
      # replacement and passed a trivial smoke test in seconds — then hung
      # past 60s with no response on the real Answer()-shaped request, empty
      # response body, timing out five separate ways (json_schema,
      # json_object, and even a bare chat completion with no format
      # constraint at all). That is a strictly worse failure mode than 410:
      # a dead model fails one HTTP call immediately, a hanging one occupies
      # this job for however long maxAttempts x the client's 5-minute
      # timeout allows, which is what actually happened before this pin.
      NVIDIA_MODEL: openai/gpt-oss-20b
      # A verifier that is the model which wrote the claim is the weakest form
      # of a check whose entire purpose is independence.
      #
      # minimaxai/minimax-m3 hit end-of-life on 2026-09-09 (the same 410
      # shape as above). Its replacement should be a different model family
      # from NVIDIA_MODEL for exactly the independence reason above, but of
      # everything this account can actually invoke without hanging or
      # burning its token budget on unbounded reasoning before ever emitting
      # the schema (deepseek-v4-flash-0731 and glm-5.3-flash both did,
      # confirmed against this pipeline's real Verify()-shaped request),
      # gpt-oss-20b was the only one confirmed fast and correct. Sharing one
      # model across both stages is a real loss, forced by this account's
      # narrow entitlements rather than chosen — the fix is either broader
      # NVIDIA access or a second provider's key added to this workflow's
      # secrets, not a different NVIDIA model name.
      VERIFY_MODEL: openai/gpt-oss-20b
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: ci_fixtures
      QDRANT_CACHE_COLLECTION: ci_cache
      RERANKER_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build -o ask-my-docs ./cmd/ask-my-docs

      # The gate needs three things, and for most of this repo's life it only
      # checked one of them.
      #
      # While eval/golden.jsonl was empty, every step below was skipped and the
      # job reported green — a passing build that measured nothing. Adding
      # golden items turned the steps on and the job went red on a missing
      # VOYAGE_API_KEY, which had never been set. The check was not wrong about
      # golden items; it was wrong that golden items were sufficient.
      #
      # So check all three, and when any is missing skip *visibly*: a warning
      # in the log, a note in the job summary, and a green build that does not
      # pretend a quality gate ran.
      # The gate needs its inputs present, and for most of this repo's life it
      # only checked one of them.
      #
      # While eval/golden.jsonl was empty, every step below was skipped and the
      # job reported green — a passing build that measured nothing. Adding
      # golden items turned the steps on and the job went red on a secret that
      # had never been set. The check was not wrong about golden items; it was
      # wrong that golden items were sufficient.
      #
      # So check everything, and when any input is missing skip *visibly*: a
      # warning per reason, a job summary saying in as many words that nothing
      # was measured, and a green build. Red for "you did not configure an
      # optional secret" is how people learn to ignore red.
      - name: Can the gate run?
        id: gate
        run: |
          reasons=()
          n=$(grep -cve '^\s*$' -e '^\s*//' eval/ci-golden.jsonl || true)
          if [ "$n" -eq 0 ]; then
            reasons+=('`eval/ci-golden.jsonl` has no items')
          fi
          docs=$(find eval/fixtures -type f | wc -l)
          if [ "$docs" -eq 0 ]; then
            reasons+=('`eval/fixtures/` is empty — there is nothing to index')
          fi
          if [ ! -s eval/ci-baseline.json ]; then
            reasons+=('`eval/ci-baseline.json` is missing — nothing to compare against')
          fi
          if [ -z "$NVIDIA_API_KEY" ]; then
            reasons+=('`NVIDIA_API_KEY` is not set as a repository secret')
          fi

          if [ ${#reasons[@]} -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "### Quality gate running — $n golden items over $docs documents" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          {
            echo "### ⚠️ Quality gate SKIPPED"
            echo
            echo "This build is green because the unit tests passed. **No quality"
            echo "metric was measured.** Missing:"
            echo
            for r in "${reasons[@]}"; do echo "- $r"; done
            echo
            echo "See _Evaluation and CI gating_ in the README to turn it on."
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "${reasons[@]}"; do
            echo "::warning::quality gate skipped: ${r//\`/}"
          done

      # A service container's health check cannot express "the model finished
      # downloading", and TEI pulls ~1GB before it serves. Waiting here fails
      # with a clear message rather than as a confusing rerank error later.
      #
      # On timeout, print the container's own log. Without it the failure reads
      # as "slow runner, try again" — which is what a genuine misconfiguration
      # looked like here for an entire debugging session, when the real message
      # (no ONNX weights, backend refused to start) was sitting in a log nobody
      # surfaced until the job was already torn down.
      - name: Wait for the reranker
        if: steps.gate.outputs.run == 'true'
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8081/health >/dev/null; then
              echo "reranker ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::group::reranker container log"
          docker logs "$(docker ps -aq --filter ancestor=ghcr.io/huggingface/text-embeddings-inference:cpu-1.7 | head -1)" 2>&1 | tail -50 || true
          echo "::endgroup::"
          echo "::error::reranker did not become ready in 15 minutes"; exit 1

      # CONTEXT_PROVIDER=none is what makes this index reproducible. With it
      # unset, ingest asks the model to write a context line per chunk batch and
      # bakes that text into the vectors — so a re-run indexes different vectors
      # for identical inputs, retrieval scores move on their own, and a gate
      # comparing against a fixed baseline is measuring sampling noise. The
      # derived context (filename plus heading path) is deterministic.
      #
      # It is also the expensive half of ingest: contextualization measured
      # >95% of the wall clock on a 780-chunk document.
      - name: Index the fixtures
        if: steps.gate.outputs.run == 'true'
        env:
          CONTEXT_PROVIDER: none
        run: ./ask-my-docs ingest -dir eval/fixtures

      # Fails the build if a gated metric regresses past the tolerance against
      # eval/ci-baseline.json. Regenerate deliberately, and only when a change
      # is meant to move the numbers:
      #   PROVIDER=nvidia LLM_PROVIDER=nvidia QDRANT_COLLECTION=ci_fixtures \
      #     ./ask-my-docs ingest -dir eval/fixtures
      #   PROVIDER=nvidia LLM_PROVIDER=nvidia QDRANT_COLLECTION=ci_fixtures \
      #     ./ask-my-docs eval -golden eval/ci-golden.jsonl \
      #       -baseline eval/ci-baseline.json -judge=false -update-baseline
      #
      # -judge=false: the judge would be the model that wrote the answers,
      # which measured 0.15-0.19 too generous. A real correctness gate needs a
      # second, independent key; until there is one, not measuring it is more
      # honest than measuring it wrong.
      - name: Run gated eval
        if: steps.gate.outputs.run == 'true'
        run: |
          ./ask-my-docs eval \
            -golden eval/ci-golden.jsonl \
            -baseline eval/ci-baseline.json \
            -out metrics.json -judge=false -verbose -tolerance 0.02

      # Kept regardless of outcome so regressions are diffable across runs.
      - name: Upload metrics
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics-${{ github.sha }}
          path: metrics.json
