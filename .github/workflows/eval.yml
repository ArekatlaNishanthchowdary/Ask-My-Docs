name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Unit tests plus the Qdrant wire-format integration tests, which use
  # synthetic vectors and need no API keys. Always runs, forks included.
  unit:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # Quality + performance gate. Runs the real pipeline against a real index.
  #
  # This job uses PROVIDER=cloud: GitHub-hosted runners have no GPU, so a local
  # 7B would take tens of minutes per run. To gate the local stack instead, move
  # this job to a self-hosted runner with Ollama and set PROVIDER=ollama — the
  # baseline is provider-specific, so regenerate eval/baseline.json when you do.
  eval:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PROVIDER: cloud
      QDRANT_URL: http://localhost:6333
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build -o ask-my-docs .

      # The gate needs three things, and for most of this repo's life it only
      # checked one of them.
      #
      # While eval/golden.jsonl was empty, every step below was skipped and the
      # job reported green — a passing build that measured nothing. Adding
      # golden items turned the steps on and the job went red on a missing
      # VOYAGE_API_KEY, which had never been set. The check was not wrong about
      # golden items; it was wrong that golden items were sufficient.
      #
      # So check all three, and when any is missing skip *visibly*: a warning
      # in the log, a note in the job summary, and a green build that does not
      # pretend a quality gate ran.
      - name: Can the gate run?
        id: gate
        run: |
          reasons=()
          n=$(grep -cve '^\s*$' -e '^\s*//' eval/golden.jsonl || true)
          if [ "$n" -eq 0 ]; then
            reasons+=('`eval/golden.jsonl` has no items')
          fi
          # corpus/ is gitignored except its README, so a fresh checkout has
          # nothing to index. Golden items reference chunk ids from documents
          # that are deliberately not published, and `eval` fails fast on ids
          # it cannot find rather than scoring them 0 forever.
          docs=$(find corpus -type f ! -name 'README.md' | wc -l)
          if [ "$docs" -eq 0 ]; then
            reasons+=('`corpus/` has no documents (gitignored — commit a CI corpus to gate)')
          fi
          if [ -z "$VOYAGE_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            reasons+=('`VOYAGE_API_KEY` / `ANTHROPIC_API_KEY` are not set as repository secrets')
          fi

          if [ ${#reasons[@]} -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "### Quality gate running — $n golden items, $docs documents" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          {
            echo "### ⚠️ Quality gate SKIPPED"
            echo
            echo "This build is green because the unit tests passed. **No quality"
            echo "or latency metric was measured.** Missing:"
            echo
            for r in "${reasons[@]}"; do echo "- $r"; done
            echo
            echo "See _Evaluation and CI gating_ in the README to turn it on."
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "${reasons[@]}"; do
            echo "::warning::quality gate skipped: ${r//\`/}"
          done

      - name: Index the corpus
        if: steps.gate.outputs.run == 'true'
        run: ./ask-my-docs ingest -dir corpus

      # Fails the build if any gated metric regresses more than the tolerance
      # against eval/baseline.json. Regenerate a baseline deliberately with:
      #   ./ask-my-docs eval -update-baseline
      - name: Run gated eval
        if: steps.gate.outputs.run == 'true'
        run: ./ask-my-docs eval -out metrics.json -tolerance 0.02

      # Kept regardless of outcome so regressions are diffable across runs.
      - name: Upload metrics
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics-${{ github.sha }}
          path: metrics.json
