services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Uncomment and set QDRANT_API_KEY in the app to require auth.
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__ENABLE_TLS: "false"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\nhost: localhost\\n' >&3 && head -1 <&3 | grep 200"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Cross-encoder reranker. Strongly recommended: without it the reranker is an
  # LLM scoring passages, which measured ~23x slower and miscalibrated badly
  # enough to score a correct rank-1 chunk 0.00. Point RERANKER_URL at it.
  #
  # Defaults to the CPU image so it starts anywhere. For GPU, set TEI_IMAGE to
  # the tag matching your compute capability and uncomment the `deploy` block —
  # a mismatched tag fails at startup with "Runtime compute cap N is not
  # compatible", which is at least loud:
  #   turing-1.7   7.5   RTX 20xx, T4
  #   86-1.7       8.6   RTX 30xx, A10
  #   89-1.7       8.9   RTX 40xx
  #   hopper-1.7   9.0   H100
  #
  # RERANKER_MODEL: any cross-encoder on the Hub. bge-reranker-v2-m3 (568M) is
  # a good default; bge-reranker-base (278M) is faster and weaker.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE:-cpu-1.7}
    command: ["--model-id", "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}", "--port", "80"]
    ports:
      - "${RERANKER_PORT:-8081}:80"
    volumes:
      - tei_cache:/data
    environment:
      HF_HOME: /data
    # GPU reservation. Enabled because this machine has an NVIDIA GPU and
    # TEI_IMAGE is set to a CUDA tag in .env. On a machine without one, comment
    # this block out and set TEI_IMAGE=cpu-1.7 — leaving it enabled fails
    # loudly at startup, which beats silently running the CPU build.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_storage:
  tei_cache:
